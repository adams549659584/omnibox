server {
    listen 80;
    server_name localhost; # 你可以根据需要修改

    # 设置静态文件的根目录
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 强制使用 UTF-8 编码
    charset utf-8;

    # 前端 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 动态代理：转发 /proxy/<编码后的目标URL> 到 Go 代理容器
    # 浏览器直接访问 nginx（同源），nginx 再转发给 proxy 服务
    location /proxy/ {
        # 转发到 docker-compose 中的 proxy 服务
        proxy_pass http://proxy:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 透传所有请求头（含 body）
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;

        # 长超时，适配流式/大文件
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 透传 CORS 头（Go 代理已设置）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
